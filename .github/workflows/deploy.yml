name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code 
        uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/weather-agent:latest -t ${{ secrets.DOCKER_USERNAME }}/weather-agent:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/weather-agent:latest
          docker push ${{secrets.DOCKER_USERNAME}}/weather-agent:${{ github.sha }} 

      - name: Copy Kubernetes Manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          source: "k8s/*"
          target: "/home/ubuntu"
          

      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            cd /home/ubuntu/k8s

            kubectl create secret generic weather-agent-secret \
            --from-literal=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=GROQ_MODEL="${{ secrets.GROQ_MODEL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml

            kubectl set image deployment/weather-agent \
              weather-agent=${{secrets.DOCKER_USERNAME}}/weather-agent:${{github.sha}}

            kubectl rollout status deployment/weather-agent
